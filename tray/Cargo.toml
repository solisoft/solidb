[package]
name = "solidb-tray"
version = "0.1.0"
edition = "2021"
description = "Notification-area icon that starts, stops and watches a local SoliDB server on Windows"
license = "MIT"
publish = false

[[bin]]
name = "solidb-tray"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
