version: '3.8'

# SoliDB 3-Node Cluster Configuration
# Usage:
#   1. Generate keyfile: openssl rand -hex 32 > solidb.key
#   2. Choose an admin password: export SOLIDB_ADMIN_PASSWORD=$(openssl rand -hex 24)
#      Compose refuses to start without it. It used to default to `admin`,
#      which published an admin-credentialled database on ports 6745-6747 for
#      anyone who followed these instructions without exporting the variable.
#   3. Choose a JWT secret shared by all nodes: export JWT_SECRET=$(openssl rand -hex 32)
#      Without one, each node signs tokens with its own random secret, so a
#      token issued by one node is rejected by the others.
#   4. Choose a metrics token: export SOLIDB_METRICS_TOKEN=$(openssl rand -hex 32)
#      /metrics answers 401 without it; scrape with `Authorization: Bearer <token>`.
#   5. Start cluster: docker-compose -f docker-compose-cluster.yml up -d
#
# Each node binds 0.0.0.0 inside its container, advertises its compose
# hostname to peers, and names each peer with its own `--peer` flag (the
# server has no comma-separated `--cluster-peers` option).

services:
  solidb-node1:
    build: .
    image: solidb/solidb:latest
    container_name: solidb-node1
    hostname: solidb-node1
    ports:
      - "6745:6745"
    volumes:
      - solidb-data-1:/data
      - ./solidb.key:/etc/solidb/solidb.key:ro
    environment:
      - SOLIDB_PORT=6745
      - SOLIDB_ADMIN_PASSWORD=${SOLIDB_ADMIN_PASSWORD:?set SOLIDB_ADMIN_PASSWORD before starting the cluster}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before starting the cluster}
      - SOLIDB_METRICS_TOKEN=${SOLIDB_METRICS_TOKEN:?set SOLIDB_METRICS_TOKEN before starting the cluster}
      - RUST_LOG=solidb=info
    command: >
      sh -c "solidb
        --port 6745
        --data-dir /data
        --keyfile /etc/solidb/solidb.key
        --host 0.0.0.0
        --node-id solidb-node1
        --advertise solidb-node1:6745
        --peer solidb-node2:6745
        --peer solidb-node3:6745"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6745/_api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solidb-cluster
    restart: unless-stopped

  solidb-node2:
    build: .
    image: solidb/solidb:latest
    container_name: solidb-node2
    hostname: solidb-node2
    ports:
      - "6746:6745"
    volumes:
      - solidb-data-2:/data
      - ./solidb.key:/etc/solidb/solidb.key:ro
    environment:
      - SOLIDB_PORT=6745
      - SOLIDB_ADMIN_PASSWORD=${SOLIDB_ADMIN_PASSWORD:?set SOLIDB_ADMIN_PASSWORD before starting the cluster}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before starting the cluster}
      - SOLIDB_METRICS_TOKEN=${SOLIDB_METRICS_TOKEN:?set SOLIDB_METRICS_TOKEN before starting the cluster}
      - RUST_LOG=solidb=info
    command: >
      sh -c "solidb
        --port 6745
        --data-dir /data
        --keyfile /etc/solidb/solidb.key
        --host 0.0.0.0
        --node-id solidb-node2
        --advertise solidb-node2:6745
        --peer solidb-node1:6745
        --peer solidb-node3:6745"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6745/_api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solidb-cluster
    depends_on:
      solidb-node1:
        condition: service_healthy
    restart: unless-stopped

  solidb-node3:
    build: .
    image: solidb/solidb:latest
    container_name: solidb-node3
    hostname: solidb-node3
    ports:
      - "6747:6745"
    volumes:
      - solidb-data-3:/data
      - ./solidb.key:/etc/solidb/solidb.key:ro
    environment:
      - SOLIDB_PORT=6745
      - SOLIDB_ADMIN_PASSWORD=${SOLIDB_ADMIN_PASSWORD:?set SOLIDB_ADMIN_PASSWORD before starting the cluster}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before starting the cluster}
      - SOLIDB_METRICS_TOKEN=${SOLIDB_METRICS_TOKEN:?set SOLIDB_METRICS_TOKEN before starting the cluster}
      - RUST_LOG=solidb=info
    command: >
      sh -c "solidb
        --port 6745
        --data-dir /data
        --keyfile /etc/solidb/solidb.key
        --host 0.0.0.0
        --node-id solidb-node3
        --advertise solidb-node3:6745
        --peer solidb-node1:6745
        --peer solidb-node2:6745"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6745/_api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solidb-cluster
    depends_on:
      solidb-node1:
        condition: service_healthy
    restart: unless-stopped

networks:
  solidb-cluster:
    driver: bridge

volumes:
  solidb-data-1:
  solidb-data-2:
  solidb-data-3:
