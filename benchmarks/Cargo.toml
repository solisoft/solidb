[package]
name = "solidb-benchmarks"
version = "1.0.2"
edition = "2021"
publish = false

[dependencies]
solidb-client = { path = "../clients/rust-client" }
serde_json = "1"
tokio = { version = "1.35", features = ["full"] }
rayon = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
rmp-serde = "1"
