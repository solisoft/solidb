[package]
name = "solidb-compare"
version = "0.1.0"
edition = "2021"
publish = false
description = "Run the same documents and queries against SoliDB, PostgreSQL, MongoDB, ArangoDB and SurrealDB"

# A workspace of its own: the drivers of four other databases stay out of the
# root Cargo.lock, and out of the `audit` job that reads it.
[workspace]

# `src/main.rs` is `solidb-compare`. The bank: transfers in transactions,
# PostgreSQL against SoliDB, with fsynced commits and kill -9 (bank.sh).
[[bin]]
name = "solidb-bank"
path = "src/bank/main.rs"

# The graph: neighbourhoods, filtered traversals and shortest paths against
# Neo4j, Memgraph, ArangoDB and PostgreSQL (graph.sh).
[[bin]]
name = "solidb-graph"
path = "src/graph/main.rs"

# Columnar: a wide table and analytical questions against ClickHouse
# (col.sh).
[[bin]]
name = "solidb-col"
path = "src/col/main.rs"

# Time series: range reads, time buckets, last points and ingest against
# TimescaleDB and QuestDB (ts.sh).
[[bin]]
name = "solidb-ts"
path = "src/ts/main.rs"

[dependencies]
solidb-client = { path = "../../clients/rust-client" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
mongodb = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
neo4rs = "0.8"
# DuckDB runs inside the harness (col.sh): the bundled build compiles it.
duckdb = { version = "1", features = ["bundled"] }
surrealdb = { version = "4", default-features = false, features = ["protocol-ws"] }

[profile.release]
debug = 1
