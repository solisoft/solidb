apiVersion: v1
kind: Secret
metadata:
  name: solidb-secret
  namespace: solidb
  labels:
    app.kubernetes.io/name: solidb
type: Opaque
stringData:
  # Generate keyfile: openssl rand -hex 32
  # Required for cluster mode authentication between nodes
  keyfile: "REPLACE_WITH_GENERATED_KEY"
  # Generate: openssl rand -hex 32
  # Required. Every pod must sign and verify tokens with the same secret;
  # without it each pod generates its own random one, so a token issued by
  # one pod is rejected by the next and every token dies on restart.
  jwt-secret: "REPLACE_WITH_GENERATED_JWT_SECRET"
  # Generate: openssl rand -hex 32
  # Bearer token Prometheus presents on /metrics (Authorization: Bearer ...
  # or X-Metrics-Token). Without it, scrapes are refused with 401.
  metrics-token: "REPLACE_WITH_GENERATED_METRICS_TOKEN"
  # Optional: Set admin password (auto-generated if not set)
  # admin-password: "your-secure-password"
