name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # A cold release build plus the suite runs ~1h45m. This is a backstop, not
    # a budget: a hung test used to sit on the job until GitHub's 6-hour limit
    # killed it (see the webhook env-flag race fixed in src/queue/jobs.rs).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --release

  # Compile-only gate for Windows. The full test suite is not run here: a cold RocksDB C++
  # build on windows-latest is slow enough to dominate CI, and the value of this job is
  # catching portability breakage on the PR rather than at tag time in build-binaries.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # See the note in build-binaries: point bindgen at the preinstalled libclang, but
      # leave CC/CXX alone so RocksDB is built by cl.exe rather than clang++.
      - name: Configure libclang
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check
        run: cargo check --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        # libfuse3-dev is needed for --all-features: the optional `fuse` feature
        # pulls in fuser, which links against libfuse3 via pkg-config.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfuse3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      # --all-targets so test, bench and bin targets are linted too; without it
      # only the default target is checked and test code drifts unlinted.
      # --all-features covers the `fuse` feature, whose binary is otherwise
      # never linted at all.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # The docs site must describe the version in Cargo.toml. This is a plain
  # grep, not a build, so it runs in seconds and gates the release job below.
  # Without it the changelog page silently fell three releases behind.
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the tags — the Unreleased check compares HEAD
      # against the last release tag, and a shallow clone has neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Docs site matches Cargo.toml version
        run: ./scripts/check_docs_sync.sh

  # Dependency supply chain. The tree is ~640 crates deep; without this nothing
  # tells us about a RUSTSEC advisory or a licence change in a transitive dep.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Verifies the rust-version declared in Cargo.toml is actually buildable,
  # rather than asserting a number nothing checks. `cargo check` only — the
  # tests are exercised by the `test` job on stable.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Install Rust (MSRV from Cargo.toml)
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check
        run: cargo check --all-targets

  release:
    # `msrv` gates the release because cargo publish ships the declared
    # rust-version; publishing an MSRV nothing verified is a lie to consumers.
    # `docs-sync` gates it because a release whose changelog page does not
    # mention it is how the site fell three versions behind.
    # `audit` deliberately does not gate: an unfixable transitive advisory
    # should raise a flag, not block a release.
    needs: [test, clippy, fmt, msrv, docs-sync]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --draft --generate-notes

  build-binaries:
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: solidb-linux-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: solidb-darwin-arm64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: solidb-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: solidb-windows-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Install system dependencies (Linux ARM64 cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # librocksdb-sys runs bindgen, which needs libclang. LLVM, MSVC and CMake are all
      # preinstalled on windows-latest, so this only points bindgen at libclang.dll.
      # Do NOT export CC/CXX=clang here: the target is *-pc-windows-msvc, so cc-rs emits
      # MSVC-style flags (-EHsc, -std:c++20) that plain clang++ rejects. RocksDB must be
      # compiled by cl.exe.
      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz -C target/${{ matrix.target }}/release solidb solidb-dump solidb-restore

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$rel/solidb.exe","$rel/solidb-dump.exe","$rel/solidb-restore.exe" `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload to release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber ${{ github.ref_name }} ${{ matrix.artifact }}.tar.gz

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber ${{ github.ref_name }} ${{ matrix.artifact }}.zip

  publish-release:
    needs: [build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false

  docker:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ github.ref_name }} --pattern 'solidb-linux-amd64.tar.gz'
          mkdir -p binaries
          tar -xzf solidb-linux-amd64.tar.gz -C binaries
          chmod +x binaries/solidb binaries/solidb-dump binaries/solidb-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  publish:
    needs: publish-release
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
