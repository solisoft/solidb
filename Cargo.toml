[workspace]
members = ["clients/rust-client", "sdbql-core", "benchmarks"]

[package]
name = "solidb"
version = "0.33.0"
edition = "2021"
# Floor imposed by the dependency tree (rust-rocksdb 0.46 declares 1.89.0).
# Enforced by the `msrv` CI job, which builds with exactly this toolchain.
rust-version = "1.89"
default-run = "solidb"
description = "A lightweight, high-performance structured database server written in Rust."
license-file = "LICENCE.md"
repository = "https://github.com/solisoft/solidb"
keywords = ["database", "nosql", "json", "rest-api", "rust"]
categories = ["database", "web-programming::http-server"]
include = ["src/**/*", "README.md", "LICENCE.md", "Cargo.toml", "docs/**/*"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server
axum = { version = "0.8.7", features = ["multipart", "ws", "macros"] }
# Drive HTTP connections manually (instead of `axum::serve`) so we can set an
# HTTP/1 header-read timeout — see the multiplexed HTTP server in main.rs.
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace", "cors", "compression-gzip", "compression-zstd"] }
async-stream = "0.3"
async-trait = "0.1"

# WebSocket Client (for global changefeed aggregation)

tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.4"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_urlencoded = "0.7"
serde_json = "1.0"
serde_bytes = "0.11"
bincode = "1.3"
lz4_flex = "0.12"
base64 = "0.22"
base32 = "0.5"
jsonschema = "0.45"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability - OpenTelemetry trace context propagation
opentelemetry = { version = "0.17", features = ["trace"] }
tracing-opentelemetry = "0.17"

# CLI
clap = { version = "4.4", features = ["derive"] }
dotenvy = "0.15"

# Utilities
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid7 = "1.0"
ulid = "1.1"
nanoid = "0.4"
regex = "1.10"
seahash = "4.1"  # Uniform hash distribution for sharding

# Storage
rust-rocksdb = "0.46"
cron = "0.15"

# Authentication
argon2 = "0.5"
# Keep the aws_lc_rs backend: the `rust_crypto` alternative pulls in the `rsa` crate, which
# commit 7320477 deliberately removed (RUSTSEC-2023-0071, no fixed version). See the
# windows-gated aws-lc-rs entry below for how this stays buildable on windows-msvc.
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs", "use_pem"] }
once_cell = "1.19"
rand_core = "0.6"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
md5 = "0.8"
subtle = "2.6"

# Temp directories (needed by benchmark)
tempfile = "3.10"

# HTTP client (for benchmarks)
# rustls rather than the default native-tls: it keeps the build free of OpenSSL, which
# otherwise needs Perl + NASM on Windows. default-features = false drops http2 and charset
# along with native-tls, so both are re-added explicitly.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "blocking",
    "multipart",
    "rustls",
    "http2",
    "charset",
    "system-proxy",
] }

# FUSE filesystem (requires macFUSE on macOS)
fuser = { version = "0.16", optional = true }

# Daemon mode (Unix only)
# daemonize crate removed - using custom implementation in src/daemon.rs
# daemonize = "0.5"
libc = "0.2"

# Parallel processing (for concurrent benchmarks)
rayon = "1.8"
csv = "1.4.0"

# CLI UX
indicatif = "0.18"
colored = "3.0"
rustyline = "17"

# System info for stats
sysinfo = "0.38"

# Prometheus metrics
prometheus = "0.14"
futures = { version = "0.3.31", features = ["std"] }

# Embedded Lua scripting
mlua = { version = "0.11.5", features = ["lua54", "vendored", "async", "serialize", "send"] }
rmp-serde = "1.3.1"

# Enhanced validation and sanitization
sanitizer = "1.0"
slug = "0.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Cookie handling
cookie = "0.18"
time = "0.3.47"

# Caching
lru = "0.16"
fastbloom = { version = "0.17.0", features = ["serde"] }
cuckoofilter = { version = "0.5", features = ["serde_support"] }
parking_lot = "0.12"
dashmap = "6"

# Self-update
flate2 = "1"           # Gzip decompression
tar = "0.4"            # Tar archive extraction

# CLI Script Development
notify = "8"           # File system watcher
toml = "1.0"           # Config file parsing
walkdir = "2"          # Directory traversal
similar = "2"          # Diff generation
rpassword = "7"        # Secure password input

# TUI
ratatui = "0.29"       # TUI framework
crossterm = "0.29"     # Cross-platform terminal backend
tui-textarea = { version = "0.7", features = ["search"] }   # Multi-line text editor widget

# Default binary
[[bin]]
name = "solidb"
path = "src/main.rs"

[[bin]]
name = "solidb-dump"
path = "src/bin/solidb-dump.rs"

[[bin]]
name = "solidb-restore"
path = "src/bin/solidb-restore.rs"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3

[profile.bench]
inherits = "release"

[dev-dependencies]
tokio-test = "0.4"
solidb-client = { path = "clients/rust-client" }

# Memory allocator: jemalloc fragments far less than glibc malloc and returns
# freed memory to the OS. With one column family per collection plus many
# Tokio/RocksDB threads, glibc's per-thread arenas pin RSS at the allocation
# high-water mark (multi-GB) long after the memory is freed; jemalloc keeps
# RSS tracking the actual working set. Not used under MSVC (Windows).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

# aws-lc-sys (pulled in by jsonwebtoken and by reqwest's rustls provider) assembles its
# x86_64 asm with NASM on windows-msvc, which is not on the GitHub runner image. The
# prebuilt-nasm feature uses the object files shipped in the crate instead, leaving CMake +
# MSVC as the only build requirements — both preinstalled on windows-latest. Feature
# unification applies this to every aws-lc-rs in the graph.
[target.'cfg(windows)'.dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

[features]
fuse = ["dep:fuser"]

[[bin]]
name = "solidb-fuse"
path = "src/bin/solidb-fuse.rs"
required-features = ["fuse"]

[[bin]]
name = "solidb-repl"
path = "src/bin/solidb-repl.rs"

[workspace.metadata.release]
sign-commit = false
sign-tag = false
push-remote = "origin"
consolidate-commits = false
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "{{tag_name}}"
tag-name = "v{{version}}"
pre-release-replacements = []
publish = false

