[package]
name = "solidb-client"
version = "1.0.2"
edition = "2021"
description = "Official Rust client for SoliDB database with HTTP and TCP transport"
license = "MIT"
repository = "https://github.com/solisoft/solidb"
keywords = ["database", "client", "solidb", "messagepack", "http"]
categories = ["database", "asynchronous"]

[[bin]]
name = "benchmark"
path = "benchmark.rs"

[[example]]
name = "tcp_concurrent_bench"
path = "examples/tcp_concurrent_bench.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
# rustls rather than the default native-tls: this crate is a dev-dependency of solidb, so
# native-tls here would drag openssl-sys back into `cargo test` and require a system OpenSSL
# on Windows. No native-tls-specific API is used.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "http2",
    "charset",
    "system-proxy",
] }
# Offline sync dependencies
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json", "uuid"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
dirs = "5.0"
tracing = "0.1"
# Local query execution
sdbql-core = { path = "../../sdbql-core", version = "1.0.2" }
# UniFFI for mobile bindings (optional)
uniffi = { version = "0.28", features = ["cli", "tokio"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"

[lib]
name = "solidb_client"
crate-type = ["cdylib", "staticlib", "lib"]

[build-dependencies]
uniffi = { version = "0.28", features = ["build"], optional = true }

[features]
default = []
mobile = ["uniffi"]
